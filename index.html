<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umberto Anniciello</title>
<meta name="description" content="umbertoanniciello.com is under construction. In the meantime, Umberto Anniciello is on LinkedIn.">
<link rel="canonical" href="https://umbertoanniciello.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://umbertoanniciello.com/">
<meta property="og:title" content="Umberto Anniciello">
<meta property="og:description" content="Under construction. Everything worth knowing is on LinkedIn.">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E2A47'/%3E%3Cpath d='M9 8v11a7 7 0 0 0 14 0V8' fill='none' stroke='%23EDE7DC' stroke-width='2.5'/%3E%3Cpath d='M7 26h18' stroke='%23C9A227' stroke-width='2'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:        #0E2A47;
    --ink-deep:   #061627;
    --paper:      #EDE7DC;
    --paper-soft: rgba(237,231,220,.66);
    --paper-faint:rgba(237,231,220,.38);
    --brass:      #C9A227;
    --brass-soft: rgba(201,162,39,.42);
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.5rem,6vw,4rem);
    background:
      radial-gradient(120% 90% at 50% 30%, #12314F 0%, var(--ink) 42%, var(--ink-deep) 100%);
    color:var(--paper);
    font-family:"Jost", ui-sans-serif, system-ui, sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  main{
    width:100%;
    max-width:44rem;
    text-align:center;
  }

  /* ---- the domain, so a visitor knows they arrived ---- */
  .domain{
    margin:0;
    font-size:.72rem;
    letter-spacing:.24em;
    text-transform:lowercase;
    color:rgba(237,231,220,.5);
  }

  /* ---- the one bold element ---- */
  .headline{
    font-family:"Bodoni Moda", Didot, "Times New Roman", serif;
    font-weight:400;
    font-size:clamp(3rem,12.4vw,8.5rem);
    line-height:.9;
    letter-spacing:-.02em;
    margin:clamp(1.6rem,5vw,2.6rem) 0 0;
  }
  .headline span{ display:block; }

  .rule{
    width:clamp(60px,14vw,110px);
    height:1px;
    margin:clamp(1.8rem,5vw,2.6rem) auto;
    background:var(--brass);
    transform-origin:center;
  }

  .note{
    margin:0 auto;
    max-width:33ch;
    font-size:clamp(.98rem,2.4vw,1.08rem);
    line-height:1.68;
    text-wrap:balance;
    color:var(--paper-soft);
  }
  .note + .note{ margin-top:.9em; }

  .cta{
    display:inline-block;
    margin-top:clamp(2rem,5vw,2.8rem);
    padding:.95em 2.1em;
    border:1px solid var(--brass-soft);
    border-radius:2px;
    color:var(--paper);
    font-size:.86rem;
    font-weight:400;
    letter-spacing:.13em;
    text-decoration:none;
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .cta:hover,.cta:focus-visible{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink-deep);
  }

  .status{
    margin:clamp(1.7rem,4vw,2.2rem) 0 0;
    min-height:1.5em;
    font-size:.76rem;
    letter-spacing:.1em;
    line-height:1.7;
    color:var(--paper-faint);
  }
  .status b{ font-weight:400; color:var(--paper-soft); font-variant-numeric:tabular-nums; }

  .stay{
    margin-left:.55em;
    padding:0;
    border:0;
    background:none;
    color:var(--paper-faint);
    font:inherit;
    letter-spacing:inherit;
    text-decoration:underline;
    text-underline-offset:.3em;
    text-decoration-thickness:1px;
    text-decoration-color:var(--brass-soft);
    cursor:pointer;
    transition:color .3s ease;
  }
  .stay:hover,.stay:focus-visible{ color:var(--paper); }

  :focus-visible{ outline:1px solid var(--brass); outline-offset:5px; }

  /* ---- one orchestrated arrival ---- */
  .reveal{ opacity:0; transform:translateY(10px); animation:rise .95s cubic-bezier(.22,.68,.31,1) forwards; }
  .rule{ transform:scaleX(0); animation:draw 1s cubic-bezier(.22,.68,.31,1) .55s forwards; }
  .d1{ animation-delay:.05s; }
  .d2{ animation-delay:.18s; }
  .d3{ animation-delay:.75s; }
  .d4{ animation-delay:.92s; }
  .d5{ animation-delay:1.1s; }

  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes draw{ to{ transform:scaleX(1); } }

  @media (prefers-reduced-motion:reduce){
    .reveal,.rule{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<main>
  <p class="domain reveal d1">umbertoanniciello.com</p>

  <h1 class="headline reveal d2"><span>Under</span><span>construction</span></h1>

  <div class="rule" role="presentation"></div>

  <p class="note reveal d3">A website will live here one day. The estimate has been revised a number of times.</p>
  <p class="note reveal d4">Until then, everything worth knowing sits on LinkedIn, where someone else handles the design.</p>

  <a class="cta reveal d5" id="cta" href="https://www.linkedin.com/in/umberto-anniciello/">Go to LinkedIn</a>

  <p class="status reveal d5" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var DEST  = "https://www.linkedin.com/in/umberto-anniciello/";
    var status = document.getElementById("status");
    var left = 8, timer;

    function paint() {
      status.innerHTML =
        'Taking you there in <b>' + left + '</b>' +
        '<button class="stay" type="button" id="stay">stay here</button>';
      document.getElementById("stay").addEventListener("click", cancel);
    }

    function cancel() {
      clearInterval(timer);
      status.textContent =
        "Suit yourself. That was the entire website — you have now seen all of it.";
    }

    function tick() {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        status.innerHTML = "Taking you there in <b>0</b>";
        window.location.replace(DEST);
        return;
      }
      paint();
    }

    paint();
    timer = setInterval(tick, 1000);
  })();
</script>

</body>
</html>
